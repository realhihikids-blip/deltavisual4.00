name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delta-visuals-repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build
        shell: bash
        run: gradle build --console=plain --stacktrace 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          ERR=$(grep -E "error:|What went wrong|Could not|Unsupported|not found|FAILED" -A4 build.log | head -n 60)
          if [ -z "$ERR" ]; then ERR=$(tail -n 40 build.log); fi
          ERR=${ERR//'%'/'%25'}
          ERR=${ERR//$'\r'/}
          ERR=${ERR//$'\n'/'%0A'}
          echo "::error title=Build log::$ERR"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: delta-visuals-repo/build.log
          if-no-files-found: ignore

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: delta-visuals-jar
          path: delta-visuals-repo/build/libs/*.jar
          if-no-files-found: error
